name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system accessibility packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core

      - name: Set up virtualenv with system site-packages
        run: |
          python3 -m venv --system-site-packages venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (unit, component, and stdio e2e)
        run: |
          pytest tests/unit tests/component tests/e2e/test_mcp_stdio.py -v
